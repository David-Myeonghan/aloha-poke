name: Chromatic

on:
  push:
    branches:
      - main
    paths:
      - "packages/design-system/**"
  pull_request:
    paths:
      - "packages/design-system/**"

jobs:
  chromatic:
    name: Deploy to Chromatic
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build design system
        run: pnpm --filter @mydav/design-system build

      - name: Deploy to Chromatic
        id: chromatic
        uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: packages/design-system
          buildScriptName: build-storybook

      - name: Comment PR with Chromatic URLs
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const storybookUrl = '${{ steps.chromatic.outputs.storybookUrl }}';
            const buildUrl = '${{ steps.chromatic.outputs.buildUrl }}';

            const body = `## 🎨 Chromatic 배포 완료

            | 링크 | URL |
            |------|-----|
            | 📚 Storybook | ${storybookUrl} |
            | 🔍 Chromatic Build | ${buildUrl} |
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
